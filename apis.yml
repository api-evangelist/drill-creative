name: Drill Creative
description: >-
  Drill Creative, Inc. is a US-based video game development startup founded in
  2023 in Cary, North Carolina, and backed by a16z's Speedrun accelerator. The
  studio builds original, high-quality gameplay experiences for user-generated
  content (UGC) platforms, the coin-op / family-entertainment-center (FEC)
  market, and PC and console storefronts. Its early releases are built on
  Fortnite via Unreal Editor for Fortnite (UEFN), including "Elimination
  Confirmed," a 16-player competitive first-person shooter, and "Robo Bash," an
  arcade-style four-player fighting game. Drill Creative is a games company
  rather than an API provider: it publishes no public developer portal, API,
  SDK, or technical documentation, so this profile carries company identity
  only and no API artifacts.
